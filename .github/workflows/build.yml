# GitHub Actions workflow: збірка проєкту через репівський devcontainer.
#
# Ключова ідея: CI використовує ТОЙ САМИЙ Dockerfile що й локально у
# VS Code. Інакше "works on my machine" виникає постійно: локальний
# devcontainer має одні версії тулів, CI runner інші. Тут вони однакові.

name: Build

# Тригери:
# - push.branches: [main] - запускаємо тільки при push у main (тобто
#   при merge PR). Обмеження важливе: без нього push + pull_request
#   запускали б одну й ту саму збірку двічі на кожен update PR.
# - pull_request: запускаємо при відкритті PR і кожному update гілки.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  packages: read
  contents: read

jobs:
  build:
    # ubuntu-latest - загальний GitHub runner з preinstalled Docker і
    # актуальною Ubuntu. Для нашого випадку (build всередині
    # devcontainer-а) специфічний runner не потрібен.
    runs-on: ubuntu-latest

    steps:
      # Стандартний checkout коду. v4 - поточна стабільна major.
      - name: Checkout
        uses: actions/checkout@v4

      # ghcr.io вимагає lowercase для назв образів, а github.repository_owner
      # повертає оригінальний регістр нікнейму (напр. HokumMeow).
      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Логінимось у ghcr.io щоб витягнути попередньо зібраний образ.
      # Без цього кроку pull падає навіть для публічного пакету на першому
      # запиті у job-і.
      - name: Log in to ghcr.io     
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # devcontainers/ci - офіційний action від Microsoft, який запускає
      # build всередині devcontainer-а. Послідовність:
      #
      # 1. Читає .devcontainer/devcontainer.json.
      # 2. Підставляє ${localEnv:USER} і ${localEnv:HOME} зі змінних
      #    середовища runner-а (на ubuntu-latest це `runner` і
      #    `/home/runner`).
      # 3. Якщо imageName вказано і образ є в registry - тягне його
      #    замість docker build. Якщо образу немає - будує з Dockerfile.
      # 4. Монтує checkout у workspaceFolder.
      # 5. Виконує runCmd від імені remoteUser.
      #
      # CMake preset debug тримає локальну і CI-збірку в одному місці:
      # build/debug. Це також збігається з clangd compile_commands і
      # VS Code debug launch config. ARM64 preset додатково перевіряє,
      # що demo-код можна крос-компілювати для SBC target-а.
      - name: Build inside dev container
        uses: devcontainers/ci@v0.3
        with:
          # imageName - звідси action тягне образ замість docker build.
          # Публікується окремим workflow publish-image.yml.
          imageName: ghcr.io/${{ env.OWNER }}/cpp-miltech-devcontainer
          # push: never - CI тільки споживає образ, публікація — в publish-image.yml.
          push: never
          runCmd: |
            cmake --preset debug
            cmake --build --preset debug
            cmake --preset aarch64-debug
            cmake --build --preset aarch64-debug
